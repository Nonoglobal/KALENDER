<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHTPULSE — Shape Your Night</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --card: #0f0f1e;
    --border: rgba(255,255,255,0.07);
    --border-h: rgba(240,192,96,0.4);
    --gold: #f0c060;
    --gold2: #e8a830;
    --text: #f0ede8;
    --muted: #5a5870;
    --accent: #7c6af5;
    --green: #3ecf8e;
    --red: #f05c5c;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; overflow-x: hidden; cursor: none;
  }

  /* ── CURSOR ── */
  #cur { position: fixed; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); mix-blend-mode: difference; }
  #cur-r { position: fixed; width: 34px; height: 34px; border: 1px solid rgba(240,192,96,0.35); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: all 0.16s cubic-bezier(0.16,1,0.3,1); }

  /* ── NOISE ── */
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 1; opacity: 0.3; }

  /* ── INTRO ── */
  #intro { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .i-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(240,192,96,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(240,192,96,0.04) 1px, transparent 1px); background-size: 60px 60px; animation: gPulse 4s ease-in-out infinite; }
  @keyframes gPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  .i-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  .io1 { width:500px;height:500px;background:rgba(124,106,245,.18);top:-100px;right:-100px;animation:oFloat 8s ease-in-out infinite; }
  .io2 { width:400px;height:400px;background:rgba(240,192,96,.12);bottom:-80px;left:-80px;animation:oFloat 10s ease-in-out infinite reverse; }
  @keyframes oFloat { 0%,100%{transform:translate(0,0)} 33%{transform:translate(30px,-20px)} 66%{transform:translate(-20px,30px)} }
  .i-content { position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center; }
  .i-eye { font-size:11px;letter-spacing:.35em;color:var(--gold);opacity:0;transform:translateY(20px);animation:rUp .6s cubic-bezier(.16,1,.3,1) .3s forwards;margin-bottom:16px; }
  .i-title { font-family:'Syne',sans-serif;font-size:clamp(60px,12vw,120px);font-weight:800;line-height:.9;letter-spacing:-.03em;overflow:hidden; }
  .i-title .w { display:block;opacity:0;transform:translateY(100%);animation:wRev .8s cubic-bezier(.16,1,.3,1) forwards; }
  .i-title .w:nth-child(1){animation-delay:.5s;color:var(--text)}
  .i-title .w:nth-child(2){animation-delay:.75s;color:var(--gold)}
  .i-sub { font-size:15px;font-weight:300;color:var(--muted);letter-spacing:.08em;opacity:0;transform:translateY(20px);animation:rUp .6s cubic-bezier(.16,1,.3,1) 1.2s forwards;margin-top:28px; }
  .i-bar-w { width:200px;height:1px;background:rgba(255,255,255,.08);margin-top:40px;position:relative;overflow:hidden;opacity:0;animation:rUp 0s 1.4s forwards; }
  .i-bar-f { position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));width:0;animation:bLoad 1.6s cubic-bezier(.4,0,.2,1) 1.5s forwards; }
  @keyframes bLoad{to{width:100%}}
  .i-load { font-size:10px;letter-spacing:.3em;color:var(--muted);opacity:0;margin-top:14px;animation:rUp .5s ease 1.5s forwards; }
  @keyframes rUp { to{opacity:1;transform:translateY(0)} }
  @keyframes wRev { to{opacity:1;transform:translateY(0)} }
  #intro.exit { animation:iOut .9s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes iOut { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-100%) scale(.95);opacity:0;pointer-events:none} }

  /* ── APP ── */
  #app { position:relative;z-index:10;min-height:100vh;opacity:0;pointer-events:none;transition:opacity .8s ease; }
  #app.visible{opacity:1;pointer-events:all}

  /* NAV */
  .nav { position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:20px 40px;background:linear-gradient(to bottom,rgba(8,8,16,.95),transparent);backdrop-filter:blur(4px); }
  .nav-logo { font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:.05em; }
  .nav-logo span{color:var(--gold)}
  #backBtn { display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;font-weight:500;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:8px 20px;cursor:none;transition:color .2s,border-color .2s,background .2s;font-family:'DM Sans',sans-serif; }
  #backBtn:hover{color:var(--gold);border-color:var(--gold2);background:rgba(240,192,96,.06)}
  #backBtn.hidden{opacity:0;pointer-events:none}
  #backBtn svg{transition:transform .2s}
  #backBtn:hover svg{transform:translateX(-3px)}

  /* DECOR */
  .bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .dc{position:absolute;border-radius:50%;border:1px solid rgba(240,192,96,.05)}
  .dc1{width:700px;height:700px;top:50%;left:50%;transform:translate(-50%,-50%)}
  .dc2{width:500px;height:500px;top:50%;left:50%;transform:translate(-50%,-50%)}
  .dc3{width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%)}
  .dl{position:absolute;background:rgba(240,192,96,.04)}
  .dl-h{height:1px;width:100%;top:50%}
  .dl-v{width:1px;height:100%;left:50%}

  /* MAIN WRAP */
  .main-wrap { min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 24px 60px;position:relative; }

  /* ── CITY SCREEN ── */
  .city-wrap { width:100%;max-width:860px;display:flex;flex-direction:column;align-items:center;gap:40px;position:relative;z-index:10; }
  .screen-tag { font-size:10px;letter-spacing:.35em;color:var(--gold);opacity:0;animation:fUp .5s ease .1s forwards; }
  .screen-title { font-family:'Syne',sans-serif;font-size:clamp(28px,5vw,50px);font-weight:800;letter-spacing:-.03em;text-align:center;opacity:0;animation:fUp .5s ease .2s forwards;line-height:1.1; }
  .screen-sub { font-size:14px;color:var(--muted);opacity:0;animation:fUp .5s ease .3s forwards;text-align:center;line-height:1.6;max-width:440px; }
  @keyframes fUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .city-grid { display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%; }
  .city-card { position:relative;flex:1;min-width:130px;max-width:160px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:none;transition:border-color .25s,background .25s,transform .2s;opacity:0;animation:cRev .5s cubic-bezier(.16,1,.3,1) forwards; }
  .city-card:nth-child(1){animation-delay:.08s}
  .city-card:nth-child(2){animation-delay:.14s}
  .city-card:nth-child(3){animation-delay:.20s}
  .city-card:nth-child(4){animation-delay:.26s}
  .city-card:nth-child(5){animation-delay:.32s}
  .city-card:nth-child(6){animation-delay:.38s}
  .city-card:nth-child(7){animation-delay:.44s}
  .city-card:nth-child(8){animation-delay:.50s}
  .city-card:nth-child(9){animation-delay:.56s}
  .city-card:nth-child(10){animation-delay:.62s}
  .city-card.available:hover { border-color:var(--border-h);background:rgba(240,192,96,.04);transform:translateY(-4px); }
  .city-card.unavail { opacity:.35!important;cursor:not-allowed!important; }
  .city-icon { font-size:26px; }
  .city-name { font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;text-align:center; }
  .city-badge { font-size:9px;letter-spacing:.15em;padding:3px 9px;border-radius:999px;font-weight:500; }
  .badge-open { background:rgba(62,207,142,.1);color:var(--green);border:1px solid rgba(62,207,142,.2); }
  .badge-soon { background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border); }
  @keyframes cRev { from{opacity:0;transform:translateY(20px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

  /* ── REGISTRATION SCREEN ── */
  .reg-wrap { width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:32px;position:relative;z-index:10; }
  .reg-card { width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:24px;opacity:0;animation:fUp .5s ease .2s forwards; }
  .form-row { display:flex;gap:16px;flex-wrap:wrap; }
  .form-field { display:flex;flex-direction:column;gap:8px;flex:1;min-width:160px; }
  .form-label { font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:500; }
  .form-input {
    background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
    outline:none;transition:border-color .2s,background .2s;cursor:none;
    -webkit-appearance:none;
  }
  .form-input::placeholder{color:var(--muted)}
  .form-input:focus{border-color:rgba(240,192,96,.4);background:rgba(240,192,96,.03)}
  .form-input.error{border-color:var(--red)!important}
  .field-note { font-size:11px;color:var(--muted);margin-top:2px; }
  .field-err { font-size:11px;color:var(--red);margin-top:2px;display:none; }
  .field-err.show{display:block}
  .phone-row { display:flex;gap:0; }
  .phone-prefix { background:rgba(255,255,255,.04);border:1px solid var(--border);border-right:none;border-radius:10px 0 0 10px;padding:12px 14px;color:var(--muted);font-size:14px;font-family:'DM Sans',sans-serif;white-space:nowrap; }
  .phone-input { border-radius:0 10px 10px 0!important; }
  .party-wrap { position:relative; }
  .party-input { width:100%; padding-right:80px!important; }
  .char-count { position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted); }
  .submit-btn { width:100%;padding:15px 24px;border-radius:12px;background:var(--gold);color:#080800;border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;cursor:none;transition:opacity .15s,transform .15s; }
  .submit-btn:hover{opacity:.88;transform:scale(.99)}
  .city-pill { display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.15em;color:var(--gold);background:rgba(240,192,96,.08);border:1px solid rgba(240,192,96,.15);border-radius:999px;padding:5px 14px;margin-bottom:4px;opacity:0;animation:fUp .4s ease .1s forwards; }

  /* ── PROGRESS BAR ── */
  .progress-track { width:100%;display:flex;gap:6px;align-items:center;opacity:0;animation:fUp .4s ease .1s forwards; }
  .prog-seg { flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.08);transition:background .5s ease;position:relative;overflow:hidden; }
  .prog-seg.done{background:var(--gold2)}
  .prog-seg.active::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--gold2),var(--gold));animation:pFill .6s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes pFill{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}

  /* ── STEP / OPTION CARDS ── */
  .step-wrap { width:100%;max-width:900px;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:36px; }
  .step-counter{font-size:11px;letter-spacing:.3em;color:var(--gold);opacity:0;animation:fUp .5s ease .1s forwards}
  .step-question{font-family:'Syne',sans-serif;font-size:clamp(28px,5vw,48px);font-weight:700;line-height:1.1;letter-spacing:-.02em;text-align:center;opacity:0;animation:fUp .5s ease .2s forwards}
  .step-hint{font-size:13px;color:var(--muted);margin-top:6px;opacity:0;animation:fUp .5s ease .3s forwards;letter-spacing:.05em;text-align:center}
  .opts { display:flex;gap:12px;width:100%;flex-wrap:wrap;justify-content:center; }
  .opt { flex:1;min-width:130px;max-width:165px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:none;transition:border-color .25s,background .25s,transform .2s;opacity:0;animation:cRev .5s cubic-bezier(.16,1,.3,1) forwards;position:relative;overflow:hidden; }
  .opt::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(240,192,96,.06),transparent);opacity:0;transition:opacity .3s}
  .opt:hover::before{opacity:1}
  .opt:hover{border-color:var(--border-h);background:rgba(240,192,96,.04);transform:translateY(-4px)}
  .opt:nth-child(1){animation-delay:.1s}.opt:nth-child(2){animation-delay:.17s}.opt:nth-child(3){animation-delay:.24s}.opt:nth-child(4){animation-delay:.31s}.opt:nth-child(5){animation-delay:.38s}
  .opt-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:24px;transition:background .2s,transform .2s}
  .opt:hover .opt-icon{background:rgba(240,192,96,.1);transform:scale(1.08)}
  .opt-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:.03em;text-align:center;color:var(--text);line-height:1.3}
  .opt-sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}
  .opt-ring{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);transition:border-color .2s}
  .opt:hover .opt-ring{border-color:var(--gold)}

  /* ── FINAL ── */
  .final-wrap{display:flex;flex-direction:column;align-items:center;gap:48px;width:100%;max-width:900px;position:relative;z-index:10}
  .final-cards{display:flex;gap:20px;width:100%;justify-content:center;flex-wrap:wrap}
  .final-card{flex:1;min-width:240px;max-width:360px;border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:20px;cursor:none;position:relative;overflow:hidden;opacity:0;animation:cRev .5s cubic-bezier(.16,1,.3,1) forwards;transition:transform .25s}
  .final-card:hover{transform:translateY(-6px)}
  .final-card.recommend{background:var(--card);border:1px solid var(--border);animation-delay:.2s}
  .final-card.recommend:hover{border-color:rgba(124,106,245,.4)}
  .final-card.preorder{background:linear-gradient(135deg,#1a1608,#1e1a06);border:1px solid rgba(240,192,96,.2);animation-delay:.32s}
  .final-card.preorder::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(240,192,96,.08),transparent 60%);pointer-events:none}
  .final-card.preorder:hover{border-color:rgba(240,192,96,.6)}
  .fc-badge{display:inline-block;font-size:9px;letter-spacing:.25em;padding:5px 12px;border-radius:999px;font-weight:500}
  .recommend .fc-badge{background:rgba(124,106,245,.12);color:#a89cf5;border:1px solid rgba(124,106,245,.2)}
  .preorder .fc-badge{background:rgba(240,192,96,.12);color:var(--gold);border:1px solid rgba(240,192,96,.2)}
  .fc-icon{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px}
  .recommend .fc-icon{background:rgba(124,106,245,.1)}
  .preorder .fc-icon{background:rgba(240,192,96,.1)}
  .fc-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .fc-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}
  .fc-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:12px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:none;border:none;transition:transform .15s,opacity .15s}
  .fc-btn:hover{opacity:.88;transform:scale(.98)}
  .recommend .fc-btn{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
  .recommend .fc-btn:hover{background:rgba(124,106,245,.15)}
  .preorder .fc-btn{background:var(--gold);color:#0a0a00}

  /* ── THANK YOU ── */
  .ty-wrap{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;max-width:500px;opacity:0;animation:fUp .7s cubic-bezier(.16,1,.3,1) .1s forwards;position:relative;z-index:10}
  .ty-check{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;animation:cPop .6s cubic-bezier(.34,1.56,.64,1) .3s both}
  @keyframes cPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .ty-title{font-family:'Syne',sans-serif;font-size:clamp(40px,7vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1}
  .ty-body{font-size:15px;color:var(--muted);line-height:1.7;max-width:380px}
  .ty-tag{font-size:10px;letter-spacing:.3em;color:var(--muted);padding:8px 20px;border-radius:999px;border:1px solid var(--border);margin-top:8px}

  /* ── PRICE ── */
  .price-wrap{display:flex;flex-direction:column;align-items:center;gap:32px;width:100%;max-width:860px;position:relative;z-index:10}
  .price-row{display:flex;gap:16px;width:100%;justify-content:center;flex-wrap:wrap}
  .price-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;gap:20px;flex:1;min-width:220px;max-width:260px;position:relative;overflow:hidden;opacity:0;animation:cRev .5s cubic-bezier(.16,1,.3,1) forwards}
  .price-card:nth-child(1){animation-delay:.15s}
  .price-card:nth-child(2){animation-delay:.25s;border-color:rgba(240,192,96,.3);background:linear-gradient(160deg,#151208,#0f0d05)}
  .price-card:nth-child(3){animation-delay:.35s}
  .price-card.feat::before{content:'EMPFOHLEN';position:absolute;top:16px;right:-28px;background:var(--gold);color:#0a0800;font-size:8px;font-weight:700;letter-spacing:.2em;padding:5px 36px;transform:rotate(45deg)}
  .pc-tier{font-size:10px;letter-spacing:.25em;color:var(--muted);font-weight:500}
  .pc-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .pc-price{display:flex;align-items:baseline;gap:4px}
  .pc-eur{font-size:22px;font-weight:500;color:var(--muted)}
  .pc-amt{font-family:'Syne',sans-serif;font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text)}
  .price-card.feat .pc-amt{color:var(--gold)}
  .pc-per{font-size:12px;color:var(--muted)}
  .pc-div{height:1px;background:var(--border)}
  .pc-feats{display:flex;flex-direction:column;gap:10px}
  .pc-f{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(240,237,232,.75)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
  .price-card.feat .dot{background:var(--gold)}
  .pc-btn{padding:13px 20px;border-radius:12px;border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:none;transition:opacity .15s,transform .15s}
  .pc-btn:hover{opacity:.85;transform:scale(.98)}
  .price-card.feat .pc-btn{background:var(--gold);color:#0a0800}
  .price-card:not(.feat) .pc-btn{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border)}
  .price-note{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.05em;opacity:0;animation:fUp .4s ease .5s forwards}

  /* EXIT ANIM */
  .sExit{animation:sOut .32s ease forwards}
  @keyframes sOut{to{opacity:0;transform:translateX(-28px)}}

  /* ── VOTE BAR ── */
  .vote-bar-wrap{width:100%;margin-top:2px}
  .vote-bar-track{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .vote-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
  .vote-pct{font-size:10px;color:var(--gold);letter-spacing:.08em;margin-top:3px;text-align:center}

  /* ── PEOPLE COUNTER ── */
  #people-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
  #people-canvas.active{pointer-events:all;display:block}
  .people-section{width:100%;max-width:860px;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;animation:fUp .5s ease .1s forwards}
  .people-label{font-size:11px;letter-spacing:.25em;color:var(--muted)}
  .people-count-big{font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,64px);font-weight:800;color:var(--gold);letter-spacing:-.03em}
  .people-hint{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .people-tap-btn{margin-top:8px;padding:10px 24px;border-radius:999px;background:rgba(240,192,96,.08);border:1px solid rgba(240,192,96,.2);color:var(--gold);font-size:12px;letter-spacing:.15em;cursor:none;transition:background .2s}
  .people-tap-btn:hover{background:rgba(240,192,96,.15)}

  /* ── SUMMARY CARD ── */
  .summary-card{width:100%;max-width:500px;background:var(--card);border:1px solid rgba(240,192,96,.15);border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:12px;opacity:0;animation:fUp .5s ease .1s forwards}
  .summary-title{font-size:10px;letter-spacing:.25em;color:var(--gold);margin-bottom:4px}
  .summary-rows{display:flex;flex-direction:column;gap:8px}
  .summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .summary-key{color:var(--muted)}
  .summary-val{color:var(--text);font-weight:500;font-family:'Syne',sans-serif;font-size:12px}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-r"></div>

<!-- INTRO -->
<div id="intro">
  <div class="i-grid"></div>
  <div class="i-orb io1"></div>
  <div class="i-orb io2"></div>
  <div class="i-content">
    <div class="i-eye">DIE NACHT GEHÖRT DIR</div>
    <div class="i-title">
      <span class="w">NIGHT</span>
      <span class="w">PULSE</span>
    </div>
    <div class="i-sub">Wähle. Stimme ab. Erlebe dein Event.</div>
    <div class="i-bar-w"><div class="i-bar-f"></div></div>
    <div class="i-load">WIRD GELADEN</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="bg-decor">
    <div class="dc dc1"></div><div class="dc dc2"></div><div class="dc dc3"></div>
    <div class="dl dl-h"></div><div class="dl dl-v"></div>
  </div>
  <nav class="nav">
    <div class="nav-logo">NIGHT<span>PULSE</span></div>
    <button id="backBtn" class="hidden" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7L9 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ZURÜCK
    </button>
  </nav>
  <div class="main-wrap" id="mWrap"></div>
</div>

<script>
// ── Cursor ──
const cur = document.getElementById('cur'), curR = document.getElementById('cur-r');
let mx=-100,my=-100,rx=-100,ry=-100;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function a(){cur.style.left=mx+'px';cur.style.top=my+'px';rx+=(mx-rx)*.12;ry+=(my-ry)*.12;curR.style.left=rx+'px';curR.style.top=ry+'px';requestAnimationFrame(a)})();

// ── Schimpfwort-Filter (DE/EN) ──
const BADWORDS = ['fick','scheiß','scheiss','arsch','wichser','hurensohn','nutte','fotze','kacke','schlampe','bastard','idiot','depp','vollidiot','nazi','shit','fuck','bitch','ass','cunt','damn','piss','cock','dick','pussy','faggot','nigger','whore'];
function containsBad(s){ const l=s.toLowerCase(); return BADWORDS.some(w=>l.includes(w)); }

// ── Städte Kärnten ──
const CITIES = [
  {name:'Villach',icon:'🏙️',avail:true},
  {name:'Velden',icon:'🌊',avail:true},
  {name:'Klagenfurt',icon:'🏛️',avail:false},
  {name:'Spittal',icon:'🏔️',avail:false},
  {name:'Wolfsberg',icon:'🌲',avail:false},
  {name:'Feldkirchen',icon:'🌾',avail:false},
  {name:'St. Veit',icon:'⛪',avail:false},
  {name:'Hermagor',icon:'🏕️',avail:false},
  {name:'Völkermarkt',icon:'🏘️',avail:false},
  {name:'Friesach',icon:'🏰',avail:false},
];

// ── Selection Steps ──
const STEPS = [
  { id:'location', question:'Wo soll das Event stattfinden?', hint:'Wähle die perfekte Location',
    options:[{icon:'🏙️',label:'Rooftop',sub:'Über den Dächern'},{icon:'🌲',label:'Outdoor',sub:'Open Air & Natur'},{icon:'🏭',label:'Warehouse',sub:'Industrial Vibes'},{icon:'🏛️',label:'Venue',sub:'Exklusive Halle'},{icon:'🚢',label:'Boot',sub:'Auf dem Wasser'}]},
  { id:'theme', question:'Welches Thema soll es haben?', hint:'Das Konzept des Abends',
    options:[{icon:'🌌',label:'Futuristic',sub:'Sci-Fi & Neo-Neon'},{icon:'🌿',label:'Organic',sub:'Natur trifft Kunst'},{icon:'👑',label:'Luxury',sub:'Eleganz & Glamour'},{icon:'🎭',label:'Masquerade',sub:'Mystisch & geheimnisvoll'},{icon:'🏚️',label:'Underground',sub:'Raw & Authentisch'}]},
  { id:'colors', question:'Welche Farbpalette?', hint:'Die visuelle Sprache des Abends',
    options:[{icon:'🖤',label:'Monochrome',sub:'Schwarz, Weiß, Grau'},{icon:'🔥',label:'Warm Glow',sub:'Gold, Amber, Rot'},{icon:'🌊',label:'Cool Wave',sub:'Blau, Lila, Cyan'},{icon:'🌺',label:'Vivid',sub:'Bunt & lebendig'},{icon:'🌙',label:'Dark Neon',sub:'Dunkel + Neon'}]},
  { id:'music', question:'Welche Musik?', hint:'Der Soundtrack eurer Nacht',
    options:[{icon:'🎹',label:'Techno',sub:'Hard & Industrial'},{icon:'🎷',label:'House',sub:'Deep & Melodic'},{icon:'🎻',label:'Live Band',sub:'Akustisch & Live'},{icon:'🎤',label:'Hip-Hop',sub:'Beats & Rap'},{icon:'🎸',label:'Mixed',sub:'Alle Genres'}]},
  { id:'extras', question:'Welche Specials willst du?', hint:'Das gewisse Etwas',
    options:[{icon:'💡',label:'Light Show',sub:'Visuelle Effekte'},{icon:'🍹',label:'Open Bar',sub:'Getränke inkl.'},{icon:'🎨',label:'Live Art',sub:'Künstler vor Ort'},{icon:'📸',label:'Foto Zone',sub:'Professionelle Fotos'},{icon:'🎆',label:'Feuerwerk',sub:'Großes Finale'}]},
];

// ── State ──
let phase = 'city'; // city | register | steps | final | thankyou | price
let step = 0;
let history = [];
let selectedCity = '';
let userData = {};

function $(id){ return document.getElementById(id); }
function setBack(show){ $('backBtn').className = show ? '' : 'hidden'; }

function goBack(){
  if(!history.length) return;
  const prev = history.pop();
  phase = prev.phase; step = prev.step;
  animT(() => {
    if(phase==='city') renderCity();
    else if(phase==='register') renderRegister();
    else if(phase==='steps') renderStep();
    else if(phase==='final') renderFinal();
    else if(phase==='price') renderPrice();
  });
}

function push(){ history.push({phase,step}); }

function animT(fn){
  const w=$('mWrap');
  w.classList.add('sExit');
  setTimeout(()=>{ w.classList.remove('sExit'); fn(); },320);
}

// ════════════════════════════════
// SCREEN: CITY
// ════════════════════════════════
function renderCity(){
  phase='city';
  $('mWrap').innerHTML=`
    <div class="city-wrap">
      <div style="text-align:center">
        <div class="screen-tag">SCHRITT 1 — STANDORT</div>
        <div class="screen-title" style="margin-top:12px">Wo bist du in Kärnten?</div>
        <div class="screen-sub" style="margin-top:10px">Wähle deinen Ort. Aktuell verfügbar: <strong style="color:var(--gold)">Villach & Velden</strong></div>
      </div>
      <div class="city-grid">
        ${CITIES.map((c,i)=>`
          <div class="city-card ${c.avail?'available':'unavail'}" ${c.avail?`onclick="selectCity('${c.name}')"`:'title="Noch nicht verfügbar"'}>
            <div class="city-icon">${c.icon}</div>
            <div class="city-name">${c.name}</div>
            <div class="city-badge ${c.avail?'badge-open':'badge-soon'}">${c.avail?'VERFÜGBAR':'BALD'}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  setBack(false);
}

function selectCity(name){
  selectedCity=name;
  push();
  animT(renderRegister);
}

// ════════════════════════════════
// SCREEN: REGISTER
// ════════════════════════════════
function renderRegister(){
  phase='register';
  $('mWrap').innerHTML=`
    <div class="reg-wrap">
      <div style="text-align:center;width:100%">
        <div class="city-pill">📍 ${selectedCity}</div>
        <div class="screen-title" style="margin-top:12px;opacity:0;animation:fUp .5s ease .15s forwards">Deine Angaben</div>
        <div class="screen-sub" style="margin-top:8px;opacity:0;animation:fUp .5s ease .25s forwards">Damit wir dich benachrichtigen können, wenn es losgeht.</div>
      </div>
      <div class="reg-card">
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">VORNAME *</label>
            <input class="form-input" id="inp-fname" type="text" placeholder="Max" maxlength="40">
            <div class="field-err" id="err-fname">Bitte Vorname eingeben</div>
          </div>
          <div class="form-field">
            <label class="form-label">NACHNAME <span style="color:var(--muted);font-size:10px">(optional)</span></label>
            <input class="form-input" id="inp-lname" type="text" placeholder="Mustermann" maxlength="60">
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">TELEFONNUMMER *</label>
          <div class="phone-row">
            <div class="phone-prefix">🇦🇹 +43</div>
            <input class="form-input phone-input" id="inp-phone" type="tel" placeholder="660 1234567" maxlength="20" style="flex:1">
          </div>
          <div class="field-err" id="err-phone">Bitte gültige Telefonnummer eingeben</div>
        </div>
        <div class="form-field">
          <label class="form-label">DEIN PARTY-NAME <span style="color:var(--muted);font-size:10px">(optional)</span></label>
          <div class="party-wrap">
            <input class="form-input party-input" id="inp-party" type="text" placeholder="z.B. NightKing, LoudQueen …" maxlength="25" oninput="updateCharCount()">
            <span class="char-count" id="charCount">0/25</span>
          </div>
          <div class="field-note">Dein Name auf dem Ticket und in der Community</div>
          <div class="field-err" id="err-party">Party-Name enthält unerlaubte Wörter</div>
        </div>
        <button class="submit-btn" onclick="submitReg()">WEITER ZUR AUSWAHL →</button>
      </div>
    </div>`;
  setBack(true);
}

function updateCharCount(){
  const v=$('inp-party').value;
  $('charCount').textContent=v.length+'/25';
}

function submitReg(){
  let ok=true;
  const fname=$('inp-fname').value.trim();
  const lname=$('inp-lname').value.trim();
  const phone=$('inp-phone').value.trim();
  const party=$('inp-party').value.trim();

  // Validate fname
  if(!fname){
    $('inp-fname').classList.add('error');
    $('err-fname').classList.add('show'); ok=false;
  } else {
    $('inp-fname').classList.remove('error');
    $('err-fname').classList.remove('show');
  }

  // Validate phone — at least 7 digits
  const digits=phone.replace(/\D/g,'');
  if(digits.length<7){
    $('inp-phone').classList.add('error');
    $('err-phone').classList.add('show'); ok=false;
  } else {
    $('inp-phone').classList.remove('error');
    $('err-phone').classList.remove('show');
  }

  // Validate party name
  if(party && containsBad(party)){
    $('inp-party').classList.add('error');
    $('err-party').classList.add('show'); ok=false;
  } else {
    $('inp-party').classList.remove('error');
    $('err-party').classList.remove('show');
  }

  if(!ok) return;
  userData = { fname, lname, phone:'+43'+digits, party: party || fname };
  push();
  animT(renderStep);
}

// ════════════════════════════════
// SCREEN: STEPS
// ════════════════════════════════
function renderStep(){
  phase='steps';
  const s=STEPS[step];
  $('mWrap').innerHTML=`
    <div class="step-wrap">
      <div style="width:100%">
        <div class="progress-track">
          ${STEPS.map((_,i)=>`<div class="prog-seg ${i<step?'done':i===step?'active':''}"></div>`).join('')}
        </div>
      </div>
      <div style="text-align:center">
        <div class="step-counter">SCHRITT ${step+1} VON ${STEPS.length}</div>
        <div class="step-question">${s.question}</div>
        <div class="step-hint">${s.hint}</div>
      </div>
      <div class="opts">
        ${s.options.map((o,i)=>`
          <div class="opt" onclick="selectOpt(${i})">
            <div class="opt-ring"></div>
            <div class="opt-icon">${o.icon}</div>
            <div class="opt-label">${o.label}</div>
            <div class="opt-sub">${o.sub}</div>
          </div>`).join('')}
      </div>
    </div>`;
  setBack(step>0 || phase!=='steps');
}

function selectOpt(i){
  push();
  step++;
  if(step>=STEPS.length){ phase='final'; animT(renderFinal); }
  else animT(renderStep);
}

// ════════════════════════════════
// SCREEN: FINAL
// ════════════════════════════════
function renderFinal(){
  phase='final';
  $('mWrap').innerHTML=`
    <div class="final-wrap">
      <div style="text-align:center">
        <div class="screen-tag" style="opacity:0;animation:fUp .5s ease .1s forwards">FAST GESCHAFFT</div>
        <div class="screen-title" style="margin-top:12px">Wie möchtest du weitermachen?</div>
        <div class="screen-sub" style="margin-top:10px">Gib deine Empfehlung ab oder sichere dir deinen Platz mit einer Pre-Order.</div>
      </div>
      <div class="final-cards">
        <div class="final-card recommend" onclick="doRecommend()">
          <div class="fc-badge">KOSTENLOS</div>
          <div class="fc-icon">💡</div>
          <div><div class="fc-title">Empfehlung</div><div class="fc-desc">Stimme ab und beeinflusse das Event. Deine Wahl zählt für die finale Entscheidung.</div></div>
          <button class="fc-btn">JETZT ABSTIMMEN →</button>
        </div>
        <div class="final-card preorder" onclick="doPreorder()">
          <div class="fc-badge">PRE-ORDER</div>
          <div class="fc-icon">🎟️</div>
          <div><div class="fc-title">Pre-Order</div><div class="fc-desc">Sichere dir frühzeitig dein Ticket zum Vorzugspreis und sei garantiert dabei.</div></div>
          <button class="fc-btn">TICKET SICHERN →</button>
        </div>
      </div>
    </div>`;
  setBack(true);
}

// ════════════════════════════════
// SCREEN: THANK YOU
// ════════════════════════════════
function doRecommend(){
  push();
  animT(()=>{
    phase='thankyou';
    $('mWrap').innerHTML=`
      <div class="ty-wrap">
        <div class="ty-check" style="background:rgba(62,207,142,.1);border:1.5px solid rgba(62,207,142,.3)">✓</div>
        <div class="ty-title">DANKE<br><span style="color:var(--green)">FÜR'S VOTING!</span></div>
        <div class="ty-body">Hey <strong>${userData.fname}</strong>, deine Stimme für <strong style="color:var(--gold)">${selectedCity}</strong> wurde gezählt. Wir werten alle Abstimmungen aus und planen das Event nach den meisten Stimmen. Du wirst benachrichtigt sobald es losgeht.</div>
        <div class="ty-tag">DEINE STIMME ZÄHLT</div>
      </div>`;
    setBack(true);
  });
}

// ════════════════════════════════
// SCREEN: PREORDER
// ════════════════════════════════
function doPreorder(){ push(); animT(renderPrice); }

function renderPrice(){
  phase='price';
  $('mWrap').innerHTML=`
    <div class="price-wrap">
      <div style="text-align:center">
        <div class="screen-tag" style="opacity:0;animation:fUp .4s ease .1s forwards">PRE-ORDER — ${selectedCity}</div>
        <div class="screen-title" style="margin-top:12px">Wähle dein Ticket</div>
        <div class="screen-sub" style="margin-top:10px">Alle Tickets beinhalten Event-Zugang. Sichere dir deinen Platz jetzt.</div>
      </div>
      <div class="price-row">
        <div class="price-card">
          <div class="pc-tier">BASIC</div>
          <div class="pc-name">Early Bird</div>
          <div class="pc-price"><span class="pc-eur">€</span><span class="pc-amt">30</span></div>
          <div class="pc-per">pro Person · Early Access</div>
          <div class="pc-div"></div>
          <div class="pc-feats">
            <div class="pc-f"><span class="dot"></span>Event-Zugang</div>
            <div class="pc-f"><span class="dot"></span>Voting-Einfluss</div>
            <div class="pc-f"><span class="dot"></span>Frühzeitige Bestätigung</div>
          </div>
          <button class="pc-btn" onclick="orderDone()">JETZT BUCHEN</button>
        </div>
        <div class="price-card feat">
          <div class="pc-tier">STANDARD</div>
          <div class="pc-name">Full Experience</div>
          <div class="pc-price"><span class="pc-eur">€</span><span class="pc-amt">30</span></div>
          <div class="pc-per">pro Person · Most Popular</div>
          <div class="pc-div"></div>
          <div class="pc-feats">
            <div class="pc-f"><span class="dot"></span>Event-Zugang</div>
            <div class="pc-f"><span class="dot"></span>Voting-Einfluss</div>
            <div class="pc-f"><span class="dot"></span>Welcome-Shot</div>
            <div class="pc-f"><span class="dot"></span>Frühzeitige Bestätigung</div>
          </div>
          <button class="pc-btn" onclick="orderDone()">JETZT BUCHEN</button>
        </div>
        <div class="price-card">
          <div class="pc-tier">PREMIUM</div>
          <div class="pc-name">VIP Access</div>
          <div class="pc-price"><span class="pc-eur">€</span><span class="pc-amt">30</span></div>
          <div class="pc-per">pro Person · Limitiert</div>
          <div class="pc-div"></div>
          <div class="pc-feats">
            <div class="pc-f"><span class="dot"></span>VIP Bereich</div>
            <div class="pc-f"><span class="dot"></span>Open Bar (1h)</div>
            <div class="pc-f"><span class="dot"></span>Exklusiver Eingang</div>
            <div class="pc-f"><span class="dot"></span>Meet the Artists</div>
          </div>
          <button class="pc-btn" onclick="orderDone()">JETZT BUCHEN</button>
        </div>
      </div>
      <div class="price-note">🔒 Sichere Zahlung · Keine versteckten Kosten · Stornierung bis 72h vorher</div>
    </div>`;
  setBack(true);
}

function orderDone(){
  $('mWrap').innerHTML=`
    <div class="ty-wrap">
      <div class="ty-check" style="background:rgba(240,192,96,.1);border:1.5px solid rgba(240,192,96,.35)">🎟️</div>
      <div class="ty-title">TICKET<br><span style="color:var(--gold)">GESICHERT!</span></div>
      <div class="ty-body">Hey <strong>${userData.party}</strong>, deine Pre-Order für <strong style="color:var(--gold)">${selectedCity}</strong> wurde entgegengenommen. Du erhältst eine Bestätigung sobald das Event bestätigt ist — bleib gespannt.</div>
      <div class="ty-tag" style="color:var(--gold);border-color:rgba(240,192,96,.2)">PRE-ORDER AKTIV</div>
    </div>`;
  setBack(false);
}

// ── BOOT ──
setTimeout(()=>{
  const intro=document.getElementById('intro');
  const app=document.getElementById('app');
  intro.classList.add('exit');
  setTimeout(()=>{
    intro.style.display='none';
    app.classList.add('visible');
    renderCity();
  },700);
},3800);
</script>
</body>
</html>
